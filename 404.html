<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 — Сторінку не знайдено | Новий Рівень</title>
  <meta name="theme-color" content="#060b08">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self';">
  <!-- OWASP Clickjacking Defense: Frame-Busting -->
  <style id="anti-clickjack">body{display:none !important;}</style>
  <script>
    if (self === top) {
      var antiClickjack = document.getElementById("anti-clickjack");
      if (antiClickjack) antiClickjack.parentNode.removeChild(antiClickjack);
    } else {
      top.location = self.location;
    }
  </script>
  <link rel="stylesheet" href="style.css?v=3.1">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .error-code {
      font-size: 96px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--neon-green, #00ff66);
      text-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
      margin: 0;
      line-height: 1;
    }
    .error-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin: 16px 0 8px;
    }
    .error-desc {
      font-size: 15px;
      color: var(--text-muted, #94a3b8);
      max-width: 440px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--neon-green, #00ff66);
      color: #060b08;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
    }
  </style>
</head>
<body>
  <div class="error-page-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Сторінку не знайдено</h1>
    <p class="error-desc">Запитуваної адреси не існує або її було переміщено. Перейдіть на головну сторінку партії «Новий Рівень».</p>
    <a href="index.html" class="btn-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>На головну</span>
    </a>
  </div>
</body>
</html>
