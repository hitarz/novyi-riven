<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404 — Сторінку не знайдено | Новий Рівень</title>
  <meta name="theme-color" content="#060b08">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self';">

  <!-- OWASP Clickjacking Defense: Frame-Busting -->
  <style id="anti-clickjack">body{display:none !important;}</style>
  <script>
    if (self === top) {
      var antiClickjack = document.getElementById("anti-clickjack");
      if (antiClickjack) antiClickjack.parentNode.removeChild(antiClickjack);
    } else {
      top.location = self.location;
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=4.0">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .error-code {
      font-size: clamp(80px, 15vw, 120px);
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--accent-hover);
      margin: 0;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: clamp(22px, 3.5vw, 28px);
      font-weight: 800;
      color: var(--text-primary);
      margin: 16px 0 8px;
      letter-spacing: -0.02em;
    }
    .error-desc {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 440px;
      margin-bottom: 28px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="error-page-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Сторінку не знайдено</h1>
    <p class="error-desc">Запитуваної адреси не існує або її було переміщено. Перейдіть на головну сторінку партії «Новий Рівень».</p>
    <a href="index.html" class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>На головну</span>
    </a>
  </div>
</body>
</html>
