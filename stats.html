<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Статистика квесту — Партія «Новий Рівень»</title>
  <meta name="theme-color" content="#060b08">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' https://countapi.mileshilliard.com;">
  
  <!-- OWASP Clickjacking Defense: Frame-Busting -->
  <style id="anti-clickjack">body{display:none !important;}</style>
  <script>
    if (self === top) {
      var antiClickjack = document.getElementById("anti-clickjack");
      if (antiClickjack) antiClickjack.parentNode.removeChild(antiClickjack);
    } else {
      top.location = self.location;
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=4.0">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <style>
    .counter-display {
      font-size: clamp(48px, 10vw, 76px);
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--accent-hover);
      margin: 16px 0;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .stats-card {
      text-align: center;
      padding: 40px 24px;
    }
    .stats-label {
      font-family: var(--font-mono);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .stats-meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .stats-btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <div class="main-container" style="max-width: 620px;">
    <!-- Top Navigation Bar -->
    <nav class="top-bar">
      <a href="index.html" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>На головну</span>
      </a>
    </nav>

    <!-- Header -->
    <header style="text-align: center; margin-bottom: 24px;">
      <div class="emblem-ring" style="width: 88px; height: 88px; margin: 0 auto 16px;">
        <img src="assets/logo.jpg" alt="Новий Рівень" class="emblem-photo">
      </div>
      <h1 class="hero-headline" style="font-size: clamp(26px, 4vw, 36px); margin-bottom: 6px;">Аналітика <span>Квесту</span></h1>
      <p style="font-size: 14px; color: var(--text-muted);">Панель адміністратора</p>
    </header>

    <div class="cyber-card stats-card">
      <div class="stats-label">Кількість переходів на квест:</div>
      
      <div id="counterValue" class="counter-display">...</div>

      <p class="section-description" style="margin: 0 auto; text-align: center;">
        Фіксує кожне відкриття секретного терміналу через корону сови, потрійний тап чи посилання.
      </p>

      <div class="stats-btn-row">
        <button type="button" id="refreshBtn" class="btn-primary" style="height: 44px; padding: 0 22px; font-size: 14px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Оновити дані</span>
        </button>

        <a href="https://countapi.mileshilliard.com/api/v1/get/novyi_riven_quest_clicks_licey_2026" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="font-size: 13.5px; height: 44px;">
          <span>🌐 JSON API</span>
        </a>
      </div>

      <div id="lastUpdated" class="stats-meta">Оновлено щойно</div>
    </div>

    <footer class="footer" style="background: transparent; border-top: 1px solid var(--border-subtle); padding: 24px 0 32px; margin-top: 24px;">
      <div style="text-align: center;">
        <p>&copy; Партія «Новий Рівень». Внутрішня статистика переходів.</p>
      </div>
    </footer>
  </div>

  <script>
    const counterValue = document.getElementById('counterValue');
    const refreshBtn = document.getElementById('refreshBtn');
    const lastUpdated = document.getElementById('lastUpdated');

    const API_URL = 'https://countapi.mileshilliard.com/api/v1/get/novyi_riven_quest_clicks_licey_2026';

    async function loadStats() {
      counterValue.style.opacity = '0.5';
      try {
        const res = await fetch(API_URL + '?t=' + Date.now(), { cache: 'no-cache' });
        if (!res.ok) throw new Error('Помилка сервера статистики');
        const data = await res.json();
        
        const val = typeof data.value === 'number' ? data.value : 0;
        counterValue.textContent = val.toLocaleString();
        lastUpdated.textContent = 'Останнє оновлення: ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error(e);
        counterValue.textContent = '0';
        lastUpdated.textContent = 'Немає даних або ще 0 кліків';
      } finally {
        counterValue.style.opacity = '1';
      }
    }

    refreshBtn.addEventListener('click', loadStats);
    loadStats();
  </script>
</body>
</html>
